<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPC Visual: Aarthi's gated housing society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>Aarthi's gated society</h1>
    <p class="intro">An AWS VPC, explained step by step.</p>
    <nav id="steps" aria-label="Steps"></nav>
    <div class="ctrl">
      <button id="auto" type="button">Auto-play</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <h2>What the moving things mean</h2>
    <ul id="legend"></ul>
  </aside>
  <main>
    <div class="stage"><svg id="diagram" viewBox="0 0 1100 620" role="img" aria-label="Animated AWS VPC diagram"></svg></div>
    <section class="cap" aria-live="polite">
      <h2 id="cap-title"></h2>
      <p><b>In plain words</b><span id="cap-plain"></span></p>
      <p><b>Technical name</b><span id="cap-tech"></span></p>
      <p><b>Watch the picture</b><span id="cap-watch"></span></p>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
